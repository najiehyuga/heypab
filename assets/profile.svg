<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141d2f"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#00c6ff"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)" stroke="url(#cyanGrad)" stroke-width="4"/>

  <!-- Tactical Visor / Gamer Mask Silhouette -->
  <path d="M45,95 Q100,55 155,95 L145,135 Q100,165 55,135 Z" fill="#0f172a" stroke="url(#violetGrad)" stroke-width="3"/>

  <!-- Cyber Visor Glow Strip -->
  <path d="M55,96 Q100,75 145,96 L140,108 Q100,88 60,108 Z" fill="url(#cyanGrad)" opacity="0.9"/>

  <!-- Gamer Monogram HP -->
  <text x="100" y="148" font-family="'Rajdhani', sans-serif" font-size="44" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="2">
    HP
  </text>

  <!-- Crosshair Accent Dots -->
  <circle cx="100" cy="40" r="3" fill="#00f2fe"/>
  <circle cx="40" cy="100" r="3" fill="#00f2fe"/>
  <circle cx="160" cy="100" r="3" fill="#00f2fe"/>
</svg>
